[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bonded-exhibition-chatbot"
version = "4.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "aiofiles>=24.1.0",
    "apscheduler>=3.10.0",
    # Legacy (Flask 유지 — Phase 6에서 제거)
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "gunicorn>=21.2.0",
    "requests>=2.28.0",
    "pdfminer.six>=20221105",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0.0",
    "anthropic>=0.34.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "import-linter>=2.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N806"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["src/", "tests/", "scripts/", "deploy/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "api must not import repositories"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.repositories"]

[[tool.importlinter.contracts]]
name = "services must not import api"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["app.api"]

[[tool.importlinter.contracts]]
name = "repositories must not import services"
type = "forbidden"
source_modules = ["app.repositories"]
forbidden_modules = ["app.services"]

[[tool.importlinter.contracts]]
name = "models must be a leaf"
type = "forbidden"
source_modules = ["app.models"]
forbidden_modules = ["app.services", "app.api", "app.repositories"]
